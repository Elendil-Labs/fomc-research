[project]
name = "fomc-server"
version = "0.1.0"
description = "Local MCP server (stdio): FOMC regime-intel tools over the fomc-research data"
requires-python = ">=3.13"
dependencies = [
  "mcp>=1.20.0,<2",
  "anyio>=4.0",
  "fomc",
]

[project.scripts]
fomc-intel = "fomc_server.server:main"

[tool.uv.sources]
fomc = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fomc_server"]

[tool.pytest.ini_options]
# Keep pytest rootdir here (not the repo root) so this package's suite does not
# inherit the root asyncio_mode/pythonpath settings.
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
