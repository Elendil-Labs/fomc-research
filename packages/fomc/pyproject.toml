[project]
name = "fomc"
version = "0.1.0"
description = "FOMC primary-source collection (statements, minutes, SEP, speeches) and Warsh-vs-Powell analysis"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypdf>=4.0.0",
    "pandas>=2.0",
    "yfinance>=0.2",
]

[project.scripts]
fomc = "fomc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fomc"]
